services:
  hub:
    image: golang:1.24
    working_dir: /workspace
    command:
      - bash
      - -c
      - go run ./harness/cmd/mnemon-hub serve --addr 0.0.0.0:9787 --store /state/hub.db --replicas /state/replicas/replicas.json
    volumes:
      - ${MNEMON_R3_ROOT:-../../..}:/workspace:ro
      - ${MNEMON_R3_DOCKER_WORK:?set MNEMON_R3_DOCKER_WORK}:/state
      - gomodcache:/go/pkg/mod
      - gocache:/root/.cache/go-build
    ports:
      - "9787"

  node-a:
    image: golang:1.24
    working_dir: /workspace
    profiles: ["run"]
    command:
      - go
      - run
      - ./harness/scripts/r3-1/docker/probe.go
      - --mode
      - push
      - --endpoint
      - http://hub:9787
      - --token
      - token-a
      - --replica-id
      - local-a
      - --decision-id
      - docker-local-a
      - --content
      - "Docker 本地多节点同步: A 推送中文事件"
      - --allow-insecure
    volumes:
      - ${MNEMON_R3_ROOT:-../../..}:/workspace:ro
      - gomodcache:/go/pkg/mod
      - gocache:/root/.cache/go-build

  node-b:
    image: golang:1.24
    working_dir: /workspace
    profiles: ["run"]
    command:
      - bash
      - -c
      - go run ./harness/scripts/r3-1/docker/probe.go --mode pull --endpoint http://hub:9787 --token token-b --replica-id local-b --allow-insecure && go run ./harness/scripts/r3-1/docker/probe.go --mode status --endpoint http://hub:9787 --token token-b --replica-id local-b --allow-insecure
    volumes:
      - ${MNEMON_R3_ROOT:-../../..}:/workspace:ro
      - gomodcache:/go/pkg/mod
      - gocache:/root/.cache/go-build

volumes:
  gomodcache:
  gocache:
