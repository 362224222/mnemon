name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            harness/go.sum

      - name: Build
        run: make build

      - name: Run unit tests
        run: go test ./...

      - name: Run E2E tests
        run: make test

      - name: Verify R5 Harness
        env:
          HARNESS_QUALITY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: make harness-verify
