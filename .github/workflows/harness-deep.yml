name: Harness Deep Verification

on:
  pull_request:
    branches: [master]
    paths:
      - "harness/**"
      - "docs/harness/**"
      - "Makefile"
      - ".github/workflows/harness-deep.yml"
  push:
    branches: [master]
    paths:
      - "harness/**"
      - "docs/harness/**"
      - "Makefile"
      - ".github/workflows/harness-deep.yml"
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-deep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            harness/go.sum

      - name: Run complete R7 evidence gate
        env:
          HARNESS_QUALITY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: make harness-verify

      - name: Test trace observer
        run: go -C harness test ./test/observer -count=1

      - name: Test domain-operations Runtime boundary
        run: harness/test/r7/domainops/run_live_oracle.sh

      - name: Test removable R8 selector
        run: make harness-r8
